<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101415"><title>SparkChat</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");
:root{--ink:#eff3ef;--muted:#84908b;--panel:#171c1d;--panel2:#202829;--line:#2b3535;--acid:#d7f45e;--orange:#ff805c;--red:#ed5f56;--bg:#101415;font-family:"Space Grotesk","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 20% 0,#263332 0,transparent 42%),repeating-linear-gradient(115deg,rgba(255,255,255,.026) 0 1px,transparent 1px 16px),var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}#app{width:min(100%,520px);min-height:100vh;margin:auto;background:rgba(16,20,21,.9);position:relative;overflow:hidden}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.05em}.brand-mark{width:25px;height:25px;background:var(--acid);clip-path:polygon(50% 0,100% 21%,88% 100%,12% 100%,0 21%);position:relative}.brand-mark:after{content:"";position:absolute;inset:7px;background:#111718;clip-path:inherit}.eyebrow{color:var(--acid);font:11px "DM Mono";text-transform:uppercase;letter-spacing:.12em}.top-action{color:var(--muted);background:none;font-size:22px;padding:5px}.view{min-height:calc(100vh - 70px);padding-bottom:88px;animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.home-head{padding:28px 20px 18px;display:flex;align-items:end;justify-content:space-between}.home-head h1{margin:4px 0 0;font-size:32px;letter-spacing:-.04em}.date{color:var(--muted);font:11px "DM Mono"}.search{margin:0 20px 20px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#151b1c;padding:11px 13px;color:var(--muted)}.search input{width:100%;border:0;outline:0;color:var(--ink);background:none;font-size:13px}.list{display:flex;flex-direction:column}.contact{width:100%;padding:15px 20px;display:flex;gap:13px;text-align:left;color:var(--ink);background:none;border-bottom:1px solid rgba(43,53,53,.65);transition:background .2s}.contact:hover{background:#1c2424}.avatar{flex:0 0 52px;width:52px;height:52px;display:grid;place-items:center;font-weight:700;color:#101516;background:linear-gradient(145deg,#8d9d9a,#334443);clip-path:polygon(50% 0,91% 14%,100% 50%,84% 93%,50% 100%,14% 86%,0 50%,14% 15%);position:relative}.avatar.megatron{color:var(--acid);background:linear-gradient(145deg,#6f7977,#222b2b)}.avatar.megatron:after{content:"";position:absolute;width:12px;height:4px;background:var(--red);top:19px;left:20px;box-shadow:0 0 10px var(--red)}.avatar.small{width:42px;height:42px;flex-basis:42px;font-size:12px}.contact-body{min-width:0;flex:1}.contact-row{display:flex;justify-content:space-between;gap:10px}.contact-name{font-weight:600}.contact-time{color:var(--muted);font:10px "DM Mono"}.preview{margin-top:7px;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.badge{min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;color:#111;background:var(--acid);border-radius:99px;font:10px "DM Mono"}.bottom{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:78px;padding:9px 20px max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;border-top:1px solid var(--line);background:rgba(18,23,24,.96);backdrop-filter:blur(14px)}.tab{flex:1;color:var(--muted);background:none;font-size:10px;display:flex;flex-direction:column;gap:5px;align-items:center}.tab-icon{font-size:20px;line-height:20px}.tab.active{color:var(--acid)}
.chat{height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 100% 0,#273433 0,transparent 34%),var(--bg)}.chat-top{display:flex;align-items:center;gap:12px;padding:17px 16px 13px;border-bottom:1px solid var(--line)}.back{color:var(--ink);background:none;font-size:25px;padding:0 5px}.chat-meta{flex:1}.chat-meta strong{display:block}.chat-meta span{color:var(--acid);font:10px "DM Mono"}.call{color:#111;background:var(--acid);padding:9px 13px;font-size:12px;font-weight:700}.messages{flex:1;overflow-y:auto;padding:22px 17px 18px;display:flex;flex-direction:column;gap:13px}.message{max-width:82%;display:flex;gap:8px;align-items:end}.message.user{align-self:flex-end;flex-direction:row-reverse}.bubble{padding:11px 13px;border:1px solid var(--line);background:var(--panel);line-height:1.55;font-size:14px;white-space:pre-wrap}.message.user .bubble{color:#111;background:var(--acid);border-color:var(--acid)}.stamp{color:#65716e;font:9px "DM Mono";white-space:nowrap}.composer{display:flex;gap:8px;padding:12px 14px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#151b1c}.composer textarea{min-height:43px;max-height:110px;flex:1;resize:none;border:1px solid var(--line);outline:0;padding:11px 12px;color:var(--ink);background:var(--panel2)}.icon-btn,.send{width:43px;color:var(--ink);background:#25302f}.send{color:#111;background:var(--acid);font-weight:700}.icon-btn.recording{background:var(--orange);color:#111}.panel{margin:20px;padding:18px;border:1px solid var(--line);background:rgba(23,28,29,.86)}.panel h2{margin:0 0 18px;font-size:19px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font:10px "DM Mono";text-transform:uppercase;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);outline:0;color:var(--ink);background:var(--panel2)}.field textarea{min-height:85px;resize:vertical}.primary{width:100%;padding:13px;color:#111;background:var(--acid);font-weight:700}.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.voice{padding:11px;text-align:left;color:var(--ink);border:1px solid var(--line);background:var(--panel2)}.voice.selected{color:#111;border-color:var(--acid);background:var(--acid)}.voice b,.voice span{display:block}.voice span{margin-top:4px;font-size:10px;opacity:.7}.profile{padding:30px 20px}.profile-card{display:flex;gap:13px;align-items:center;padding-bottom:23px;border-bottom:1px solid var(--line)}.profile-card h1{margin:0 0 4px}.profile-card p{color:var(--muted);margin:0;font-size:12px}.danger{width:100%;margin-top:26px;padding:13px;color:var(--red);border:1px solid rgba(237,95,86,.45);background:transparent}
.auth{min-height:100vh;padding:38px 27px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 90% 10%,#354536 0,transparent 40%),var(--bg)}.auth h1{margin:15px 0 8px;font-size:42px;line-height:.95;letter-spacing:-.06em}.auth-sub{max-width:300px;color:var(--muted);line-height:1.6;font-size:13px}.auth-box{margin-top:30px}.auth-switch{margin-top:18px;color:var(--muted);background:none;font-size:12px}.auth-switch b{color:var(--acid)}.error{min-height:18px;color:var(--orange);font-size:12px;margin:10px 0}.toast{position:fixed;z-index:20;top:20px;left:50%;transform:translateX(-50%);padding:11px 15px;color:#111;background:var(--acid);font-size:12px;box-shadow:0 10px 30px #0008}.phone{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:65px 25px 42px;text-align:center;background:radial-gradient(circle at 50% 30%,#455451 0,transparent 28%),#111718}.phone-close{align-self:flex-end;color:var(--ink);background:none;font-size:25px}.phone .avatar{width:110px;height:110px;flex-basis:110px;font-size:25px;box-shadow:0 0 0 12px rgba(215,244,94,.08),0 0 50px rgba(215,244,94,.18)}.phone h1{margin:22px 0 5px;font-size:29px}.phone-status{color:var(--acid);font:11px "DM Mono"}.subtitle{min-height:62px;max-width:340px;color:#d9e1d7;font-size:18px;line-height:1.5}.end-call{width:65px;height:65px;border-radius:50%;color:white;background:var(--red);font-size:24px}@media(min-width:521px){body{padding:22px 0}#app{min-height:calc(100vh - 44px);box-shadow:0 0 70px #0008}.bottom{bottom:22px}}
</style>
<style>
.contact{min-height:76px}.preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}.contact-time{font-size:10px}.message.pending .bubble{color:var(--muted);font-style:italic}.message.failed .bubble{color:var(--orange);border-color:#70483e}.composer textarea:disabled{opacity:.6}.send:disabled{opacity:.55;cursor:wait}.speak{font-size:13px;padding:1px 4px}.speak.playing{color:var(--acid)}
@media(max-width:380px){.topbar{padding-left:14px;padding-right:14px}.home-head{padding-left:14px;padding-right:14px}.search{margin-left:14px;margin-right:14px}.contact{padding-left:14px;padding-right:14px}.messages{padding-left:12px;padding-right:12px}.bubble{font-size:13px}.call{padding-left:9px;padding-right:9px}}
</style>
</head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";
const app=document.querySelector("#app"),toast=document.querySelector("#toast");
const state={user:null,characters:[],voices:[],active:null,messages:[],authMode:"login",conversation:null,listening:false,sending:false};
const esc=value=>String(value??"").replace(/[&<>\"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[char]));
const appBase=location.pathname.replace(/\/?(?:index\.html)?$/i,"").replace(/\/$/,"");
const apiUrl=path=>`${appBase}${path}`;
const api=async(url,options={})=>{const response=await fetch(apiUrl(url),{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||"请求失败");return data};
function notify(text){toast.textContent=text;toast.classList.remove("hidden");setTimeout(()=>toast.classList.add("hidden"),2400)}
function avatar(character,small=false){return `<div class="avatar ${character.name==="威震天"?"megatron":""} ${small?"small":""}">${esc(character.name.slice(0,1))}</div>`}
function shell(content,active="home"){return `<header class="topbar"><div class="brand"><i class="brand-mark"></i><span>SPARKCHAT</span></div><button class="top-action" id="quick-profile" aria-label="个人中心">◌</button></header><main class="view">${content}</main><nav class="bottom"><button class="tab ${active==="home"?"active":""}" data-tab="home"><span class="tab-icon">⌂</span>联系人</button><button class="tab ${active==="create"?"active":""}" data-tab="create"><span class="tab-icon">＋</span>新建角色</button><button class="tab ${active==="profile"?"active":""}" data-tab="profile"><span class="tab-icon">◉</span>我的</button></nav>`}
async function boot(){try{const result=await api("/api/auth/me");state.user=result.user;if(!state.user)return renderAuth();await loadHome()}catch(error){renderAuth(error.message)}}
async function loadHome(){const [characters,voices]=await Promise.all([api("/api/characters"),api("/api/voices")]);state.characters=characters.characters;state.voices=voices.voices;renderHome()}
function renderAuth(error=""){app.innerHTML=`<main class="auth"><div class="eyebrow">Autonomous character terminal</div><h1>与你的<br><span style="color:var(--acid)">数字角色</span>相遇。</h1><p class="auth-sub">进入 SparkChat，和拥有独立记忆、声音与宇宙观的角色保持持续连接。</p><form class="auth-box" id="auth-form"><div class="field"><label>账号 / Handle</label><input name="username" required autocomplete="username" placeholder="输入账号"></div><div class="field"><label>密码 / Passcode</label><input name="password" type="password" required autocomplete="current-password" placeholder="输入密码"></div><p class="error">${esc(error)}</p><button class="primary">${state.authMode==="login"?"进入终端":"创建账号"}</button></form><button class="auth-switch" id="auth-switch">${state.authMode==="login"?"还没有账号？ ":"已有账号？ "}<b>${state.authMode==="login"?"立即注册":"返回登录"}</b></button><p style="color:var(--muted);font:10px 'DM Mono';margin-top:28px">预设账号 CaraLin / 2766</p></main>`;document.querySelector("#auth-form").onsubmit=authSubmit;document.querySelector("#auth-switch").onclick=()=>{state.authMode=state.authMode==="login"?"register":"login";renderAuth()}}
async function authSubmit(event){event.preventDefault();const form=new FormData(event.target);try{const result=await api(`/api/auth/${state.authMode}`,{method:"POST",body:JSON.stringify({username:form.get("username"),password:form.get("password")})});state.user=result.user;await loadHome()}catch(error){renderAuth(error.message)}}
function renderHome(){const rows=state.characters.map(character=>`<button class="contact" data-character="${character.id}">${avatar(character)}<div class="contact-body"><div class="contact-row"><span class="contact-name">${esc(character.name)}</span><span class="contact-time">${character.lastMessageAt?new Date(character.lastMessageAt+"Z").toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}):"待连接"}</span></div><div class="preview">${esc(character.lastMessage||character.tagline||"尚未建立对话")}</div></div>${character.unreadCount?`<span class="badge">${character.unreadCount}</span>`:""}</button>`).join("");app.innerHTML=shell(`<section class="home-head"><div><div class="eyebrow">Your character network</div><h1>联系人</h1></div><span class="date">${new Date().toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"})}</span></section><label class="search">⌕ <input id="search" placeholder="搜索角色或消息"></label><div class="list">${rows||`<div class="panel"><p style="color:var(--muted)">还没有角色，创建一个属于你的声音。</p></div>`}</div>`,"home");bindShell();document.querySelectorAll("[data-character]").forEach(item=>item.onclick=()=>openChat(Number(item.dataset.character)));document.querySelector("#search").oninput=event=>document.querySelectorAll(".contact").forEach(row=>row.classList.toggle("hidden",!row.textContent.toLowerCase().includes(event.target.value.toLowerCase())))}
function bindShell(){document.querySelectorAll("[data-tab]").forEach(tab=>tab.onclick=()=>{if(tab.dataset.tab==="home")renderHome();if(tab.dataset.tab==="create")renderCreate();if(tab.dataset.tab==="profile")renderProfile()});document.querySelector("#quick-profile").onclick=renderProfile}
function renderProfile(){app.innerHTML=shell(`<section class="profile"><div class="eyebrow">Identity / Session</div><div class="profile-card" style="margin-top:24px">${avatar({name:state.user.username},true)}<div><h1>${esc(state.user.username)}</h1><p>连接已持久保存 · 无需重复登录</p></div></div><div style="margin-top:25px;color:var(--muted);font-size:13px;line-height:1.7">你的角色、对话记录与个性化记忆均按账号独立保存。语音能力需要浏览器授予麦克风权限。</div><button class="danger" id="logout">退出登录</button></section>`,"profile");bindShell();document.querySelector("#logout").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});state.user=null;renderAuth()}}
function renderCreate(){const voices=state.voices.map((voice,index)=>`<button type="button" class="voice ${index===0?"selected":""}" data-voice="${voice.id}" data-name="${esc(voice.name)}"><b>${esc(voice.name)}</b><span>${esc(voice.description)}</span></button>`).join("");app.innerHTML=shell(`<section class="panel"><div class="eyebrow">Character forge / 01</div><h2>新建数字角色</h2><form id="create-form"><div class="field"><label>角色名称</label><input name="name" required placeholder="例如：阿尔茜"></div><div class="field"><label>一句话定位</label><input name="tagline" placeholder="例如：穿越星尘的侦察官"></div><div class="field"><label>人设与行为准则</label><textarea name="persona" required placeholder="描述它如何思考、说话、回应你"></textarea></div><div class="field"><label>背景设定</label><textarea name="background" placeholder="它来自哪里？经历过什么？"></textarea></div><div class="field"><label>记忆库初始内容</label><textarea name="memory" placeholder="它需要记住的称呼、偏好或约定"></textarea></div><div class="field"><label>选择音色</label><div class="voice-grid">${voices}</div><input type="hidden" name="voiceId" value="${state.voices[0]?.id||"custom"}"><input type="hidden" name="voiceName" value="${state.voices[0]?.name||"自定义音色"}"></div><button class="primary">生成角色并保存</button></form><div class="field" style="margin-top:26px"><label>用提示词生成新音色 / ElevenLabs</label><input id="voice-name" placeholder="音色名称，例如：深空裁决者"><textarea id="voice-prompt" placeholder="低沉、威严、带有金属共鸣的中文男声"></textarea><button type="button" class="primary" id="design-voice">生成并加入音色库</button></div></section>`,"create");bindShell();document.querySelectorAll("[data-voice]").forEach(button=>button.onclick=()=>{document.querySelectorAll("[data-voice]").forEach(item=>item.classList.remove("selected"));button.classList.add("selected");document.querySelector("[name=voiceId]").value=button.dataset.voice;document.querySelector("[name=voiceName]").value=button.dataset.name});document.querySelector("#create-form").onsubmit=createSubmit;document.querySelector("#design-voice").onclick=designVoice}
async function designVoice(){const button=document.querySelector("#design-voice"),name=document.querySelector("#voice-name").value.trim(),prompt=document.querySelector("#voice-prompt").value.trim();if(!name||!prompt){notify("请填写音色名称和提示词");return}button.disabled=true;button.textContent="生成中…";try{const result=await api("/api/voices/design",{method:"POST",body:JSON.stringify({name,prompt})});state.voices.push(result.voice);renderCreate();notify("新音色已加入并选中");const latest=document.querySelector(`[data-voice="${result.voice.id}"]`);if(latest)latest.click()}catch(error){notify(error.message);button.disabled=false;button.textContent="生成并加入音色库"}}
async function createSubmit(event){event.preventDefault();const form=new FormData(event.target);try{await api("/api/characters",{method:"POST",body:JSON.stringify(Object.fromEntries(form))});notify("角色已加入联系人");await loadHome()}catch(error){notify(error.message)}}
async function openChat(id){state.active=state.characters.find(item=>item.id===id);const result=await api(`/api/characters/${id}/messages`);state.messages=result.messages;renderChat()}
function renderChat(){const character=state.active;const messages=state.messages.map(message=>`<div class="message ${message.role==="user"?"user":""}">${message.role==="assistant"?avatar(character,true):""}<div><div class="bubble">${esc(message.content)}</div><span class="stamp">${message.role==="user"?"YOU":esc(character.name.toUpperCase())}${message.role==="assistant"?` <button class="top-action speak" data-speak="${esc(message.content)}" aria-label="朗读">◖</button>`:""}</span></div></div>`).join("");app.innerHTML=`<section class="chat"><header class="chat-top"><button class="back" id="back">‹</button>${avatar(character,true)}<div class="chat-meta"><strong>${esc(character.name)}</strong><span>● ONLINE / ${esc(character.voiceName)}</span></div><button class="call" id="call">☎ 电话</button></header><div class="messages" id="messages">${messages||`<div style="margin:auto;text-align:center;color:var(--muted);font-size:13px;line-height:1.8">${esc(character.name)}正在等待你的第一句话。<br>试试问问它，来自哪里。</div>`}</div><form class="composer" id="composer"><button type="button" class="icon-btn" id="dictate" aria-label="语音转文字">♩</button><textarea name="content" rows="1" placeholder="输入消息…" required></textarea><button class="send" aria-label="发送">↑</button></form></section>`;document.querySelector("#back").onclick=loadHome;document.querySelector("#call").onclick=startPhone;document.querySelector("#composer").onsubmit=sendMessage;document.querySelector("#dictate").onclick=toggleDictation;document.querySelectorAll("[data-speak]").forEach(button=>button.onclick=()=>speak(button.dataset.speak,button));scrollMessages()}
function addMessage(role,content){state.messages.push({role,content});const container=document.querySelector("#messages");const wrapper=document.createElement("div");wrapper.className=`message ${role==="user"?"user":""}`;wrapper.innerHTML=`${role==="assistant"?avatar(state.active,true):""}<div><div class="bubble"></div><span class="stamp">${role==="user"?"YOU":esc(state.active.name.toUpperCase())}</span></div>`;wrapper.querySelector(".bubble").textContent=content;container.append(wrapper);scrollMessages()}
async function sendMessage(event){event.preventDefault();if(state.sending)return;const form=event.currentTarget,textarea=form.content,sendButton=form.querySelector(".send"),content=textarea.value.trim();if(!content)return;state.sending=true;textarea.value="";textarea.disabled=true;sendButton.disabled=true;sendButton.textContent="·";addMessage("user",content);const assistant=document.createElement("div");assistant.className="message pending";assistant.innerHTML=`${avatar(state.active,true)}<div><div class="bubble">正在回应…</div><span class="stamp">${esc(state.active.name.toUpperCase())}</span></div>`;document.querySelector("#messages").append(assistant);const bubble=assistant.querySelector(".bubble");scrollMessages();try{const response=await fetch(apiUrl(`/api/characters/${state.active.id}/chat`),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||`请求失败 (${response.status})`)}if(!response.body)throw Error("浏览器不支持流式响应");const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="",answer="";while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const chunks=buffer.split("\n\n");buffer=chunks.pop()||"";for(const chunk of chunks){if(!chunk.startsWith("data: "))continue;const data=JSON.parse(chunk.slice(6));if(data.type==="delta"){answer+=data.text;bubble.textContent=answer;assistant.classList.remove("pending");scrollMessages()}if(data.type==="error")throw Error(data.message)}}if(!answer.trim())throw Error("角色没有返回有效内容");state.messages.push({role:"assistant",content:answer});const stamp=assistant.querySelector(".stamp");stamp.innerHTML=`${esc(state.active.name.toUpperCase())} <button class="top-action speak" aria-label="朗读">◖</button>`;stamp.querySelector(".speak").onclick=()=>speak(answer)}catch(error){assistant.classList.remove("pending");assistant.classList.add("failed");bubble.textContent=`未能送达回复：${error.message}`;textarea.value=content;notify("发送失败，消息已保留，可再次发送")}finally{state.sending=false;textarea.disabled=false;sendButton.disabled=false;sendButton.textContent="↑";textarea.focus()}}
function scrollMessages(){const node=document.querySelector("#messages");if(node)node.scrollTop=node.scrollHeight}
async function speak(text,button=null){if(!state.active||!text)return;if(button)button.classList.add("playing");try{const response=await fetch(apiUrl(`/api/characters/${state.active.id}/speak`),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||"语音生成失败")}const audio=new Audio(URL.createObjectURL(await response.blob()));audio.onended=()=>{if(button)button.classList.remove("playing")};audio.onerror=()=>{if(button)button.classList.remove("playing");notify("音频播放失败")};await audio.play()}catch(error){if(button)button.classList.remove("playing");notify(error.message)}}
function toggleDictation(){const button=document.querySelector("#dictate");if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){notify("当前 WebView 不支持语音转文字");return}if(state.listening){state.recognition?.stop();return}const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;state.recognition=new Recognition();state.recognition.lang="zh-CN";state.recognition.continuous=false;state.recognition.onstart=()=>{state.listening=true;button.classList.add("recording")};state.recognition.onresult=event=>{document.querySelector("textarea").value+=event.results[0][0].transcript};state.recognition.onend=()=>{state.listening=false;button.classList.remove("recording")};state.recognition.start()}
async function startPhone(){const phone=document.createElement("div");phone.className="phone";phone.innerHTML=`<button class="phone-close" id="phone-close">×</button><div>${avatar(state.active)}<h1>${esc(state.active.name)}</h1><div class="phone-status" id="phone-status">正在接通…</div></div><div class="subtitle" id="subtitle">请允许麦克风，开始自由交谈。</div><button class="end-call" id="end-call">■</button>`;document.body.append(phone);try{const token=(await api(`/api/token?characterId=${state.active.id}`)).token;await navigator.mediaDevices.getUserMedia({audio:true});state.conversation=await Conversation.startSession({conversationToken:token,onConnect:()=>phone.querySelector("#phone-status").textContent="● LIVE / 实时通话",onModeChange:mode=>phone.querySelector("#phone-status").textContent=mode.mode==="speaking"?"● OUTPUT / 角色回应中":"● LIVE / 聆听中",onMessage:message=>{if(message?.source==="ai"&&message.message)phone.querySelector("#subtitle").textContent=message.message},onError:error=>phone.querySelector("#subtitle").textContent=error?.message||"语音连接发生错误"})}catch(error){phone.querySelector("#phone-status").textContent="连接失败";phone.querySelector("#subtitle").textContent=error.message||"无法接通语音模式"}const close=async()=>{if(state.conversation)await state.conversation.endSession();state.conversation=null;phone.remove()};phone.querySelector("#phone-close").onclick=close;phone.querySelector("#end-call").onclick=close}
boot();
</script></body></html>
